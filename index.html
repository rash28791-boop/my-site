<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>AI Bot Premium</title>
<style>
:root{
  --bg:#090b16;
  --glass:rgba(255,255,255,.12);
  --glass-strong:rgba(255,255,255,.18);
  --border:rgba(255,255,255,.24);
  --text:#fff;
  --muted:rgba(255,255,255,.62);
  --accent:#7b5cfa;
  --accent2:#00d2ff;
}
[data-theme="light"]{
  --bg:#e8ecf7;
  --glass:rgba(255,255,255,.55);
  --glass-strong:rgba(255,255,255,.75);
  --border:rgba(120,130,180,.35);
  --text:#1a1d2e;
  --muted:rgba(30,35,60,.65);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Inter,system-ui,Arial,sans-serif;
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
  background:radial-gradient(circle at 20% 20%,rgba(123,92,250,.35),transparent 32%),
             radial-gradient(circle at 80% 10%,rgba(0,210,255,.28),transparent 30%),
             radial-gradient(circle at 50% 95%,rgba(255,80,180,.25),transparent 36%),
             var(--bg);
  transition:background .5s,color .5s;
}
.orb{position:fixed;width:44vmax;height:44vmax;border-radius:50%;filter:blur(50px);opacity:.42;pointer-events:none;z-index:0;animation:float 18s ease-in-out infinite alternate}
.orb.o1{left:-12vmax;top:-14vmax;background:#7b5cfa}
.orb.o2{right:-16vmax;top:-8vmax;background:#00d2ff;animation-delay:-6s}
.orb.o3{left:22vw;bottom:-24vmax;background:#ff50b4;animation-delay:-12s}
@keyframes float{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(6vw,-4vh,0) scale(1.12)}}
#particles{position:fixed;inset:0;z-index:0;pointer-events:none}
.screen{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.glass{
  background:linear-gradient(145deg,var(--glass-strong),var(--glass));
  border:1px solid var(--border);
  border-radius:26px;
  backdrop-filter:blur(22px) saturate(150%);
  -webkit-backdrop-filter:blur(22px) saturate(150%);
  box-shadow:0 24px 80px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.28);
}
/* ---------- Lock ---------- */
#lock{padding:44px 38px;text-align:center;width:min(380px,100%);animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
#lock .icon{font-size:52px;margin-bottom:12px;filter:drop-shadow(0 0 18px rgba(123,92,250,.8))}
#lock h1{font-size:26px;margin-bottom:6px}
#lock .sub{color:var(--muted);font-size:14px;margin-bottom:26px}
#pin{display:flex;gap:12px;justify-content:center;margin-bottom:24px}
.pin-cell{width:52px;height:62px;border-radius:16px;background:var(--glass);border:1px solid var(--border);font-size:28px;display:flex;align-items:center;justify-content:center;transition:.25s}
.pin-cell.filled{border-color:var(--accent);box-shadow:0 0 18px rgba(123,92,250,.55);background:var(--glass-strong)}
.pin-cell.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.key{padding:16px 0;border-radius:16px;background:var(--glass);border:1px solid var(--border);color:var(--text);font-size:20px;cursor:pointer;transition:.15s;backdrop-filter:blur(8px)}
.key:hover{background:var(--glass-strong);transform:translateY(-2px)}
.key:active{transform:scale(.94)}
#lockMsg{min-height:20px;color:#ff7b9c;font-size:14px;margin-top:14px}
/* ---------- App ---------- */
#app{width:min(860px,100%);height:min(760px,92vh);display:none;flex-direction:column;overflow:hidden;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
#app.open{display:flex}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--border);background:linear-gradient(90deg,rgba(123,92,250,.16),rgba(0,210,255,.10))}
header .logo{font-size:19px;font-weight:700;background:linear-gradient(90deg,var(--accent),var(--accent2),#ff50b4);-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% 100%;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:200% 0}}
.hbtn{background:var(--glass);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:8px 12px;cursor:pointer;font-size:15px;transition:.15s}
.hbtn:hover{background:var(--glass-strong)}
#chat{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:78%;padding:13px 17px;border-radius:20px;line-height:1.5;font-size:15px;white-space:pre-line;animation:pop .35s cubic-bezier(.2,1.4,.4,1);word-break:break-word}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,rgba(123,92,250,.55),rgba(0,210,255,.4));border:1px solid var(--border);border-bottom-right-radius:6px}
.msg.bot{align-self:flex-start;background:var(--glass);border:1px solid var(--border);border-bottom-left-radius:6px;backdrop-filter:blur(12px)}
.msg img{max-width:100%;border-radius:14px;display:block;margin-bottom:10px}
.swatch{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:6px;border:1px solid rgba(255,255,255,.5)}
.typing{align-self:flex-start;padding:12px 18px;border-radius:20px;background:var(--glass);border:1px solid var(--border)}
.typing i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:5px;animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
#inputBar{display:flex;gap:10px;padding:16px 18px;border-top:1px solid var(--border)}
#input{flex:1;padding:14px 18px;border-radius:16px;background:var(--glass);border:1px solid var(--border);color:var(--text);font-size:15px;outline:none;backdrop-filter:blur(10px)}
#input:focus{border-color:var(--accent);box-shadow:0 0 14px rgba(123,92,250,.35)}
#input::placeholder{color:var(--muted)}
.ibtn{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,rgba(123,92,250,.6),rgba(0,210,255,.45));border:1px solid var(--border);color:#fff;font-size:19px;cursor:pointer;transition:.15s;flex-shrink:0}
.ibtn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(123,92,250,.4)}
.ibtn:active{transform:scale(.93)}
/* ---------- Settings ---------- */
#settings{position:fixed;right:-340px;top:0;width:320px;height:100vh;z-index:10;padding:26px 22px;transition:right .4s cubic-bezier(.2,1,.3,1);overflow-y:auto;border-radius:0}
#settings.open{right:0}
#settings h2{font-size:20px;margin-bottom:20px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)}
.set-row span{font-size:15px}
.set-row small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.switch{position:relative;width:48px;height:26px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;border-radius:999px;background:var(--glass);border:1px solid var(--border);cursor:pointer;transition:.3s}
.slider::before{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.3s;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.switch input:checked + .slider{background:linear-gradient(90deg,var(--accent),var(--accent2));border-color:transparent}
.switch input:checked + .slider::before{transform:translateX(22px)}
#clearMem{margin-top:20px;width:100%;padding:12px;border-radius:14px;background:rgba(255,80,120,.2);border:1px solid rgba(255,80,120,.4);color:#ff9db4;cursor:pointer;font-size:14px;transition:.15s}
#clearMem:hover{background:rgba(255,80,120,.32)}
@media (max-width:560px){.msg{max-width:92%}#settings{width:280px;right:-300px}}

/* ============ ТЕЛЕФОН ============ */
@media (max-width:640px){
  body{overflow:hidden}
  .screen{padding:0}
  /* чат на весь экран, без рамок */
  #app{
    width:100%;height:100vh;height:100dvh;
    border-radius:0;border-left:none;border-right:none;
    box-shadow:none;
  }
  header{padding:12px 14px}
  header .logo{font-size:17px}
  #chat{padding:14px;gap:10px}
  .msg{max-width:92%;padding:11px 14px;font-size:15px}
  /* поле ввода: 16px против авто-зума iOS */
  #inputBar{padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));gap:8px}
  #input{font-size:16px;padding:12px 14px}
  .ibtn{width:44px;height:44px;font-size:17px}
  /* экран блокировки на весь экран */
  #lock{
    width:100%;height:100vh;height:100dvh;
    border-radius:0;border:none;
    display:flex;flex-direction:column;justify-content:center;
    box-shadow:none;
  }
  #lock .icon{font-size:46px}
  #lock h1{font-size:22px}
  .pin-cell{width:56px;height:64px}
  .keypad{gap:10px;max-width:320px;margin:0 auto;width:100%}
  .key{padding:18px 0;font-size:21px}
  /* настройки — шторка на весь экран */
  #settings{width:100%;right:-105%;border-radius:0}
  #settings.open{right:0}
}
/* горизонтальная ориентация: компактнее */
@media (max-width:640px) and (orientation:landscape){
  #lock{justify-content:flex-start;padding-top:24px}
  #lock .icon{font-size:32px;margin-bottom:4px}
  #lock h1{font-size:18px;margin-bottom:2px}
  #lock .sub{margin-bottom:14px}
  .pin-cell{width:44px;height:48px}
  .key{padding:10px 0;font-size:17px}
}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
<canvas id="particles"></canvas>

<!-- Экран блокировки -->
<div class="screen" id="lockScreen">
  <div class="glass" id="lock">
    <div class="icon">🔮</div>
    <h1>AI Bot Premium</h1>
    <div class="sub">Введите PIN-код для входа</div>
    <div id="pin">
      <div class="pin-cell" data-i="0"></div>
      <div class="pin-cell" data-i="1"></div>
      <div class="pin-cell" data-i="2"></div>
      <div class="pin-cell" data-i="3"></div>
    </div>
    <div class="keypad" id="keypad"></div>
    <div id="lockMsg"></div>
  </div>
</div>

<!-- Приложение -->
<div class="screen">
  <div class="glass" id="app">
    <header>
      <div class="logo">✨ AI Bot Premium</div>
      <button class="hbtn" id="openSettings" title="Настройки">⚙️</button>
    </header>
    <div id="chat"></div>
    <div id="inputBar">
      <button class="ibtn" id="attachBtn" title="Прикрепить фото">📷</button>
      <button class="ibtn" id="micBtn" title="Голосовой ввод">🎤</button>
      <input id="input" type="text" placeholder="Спросите что-нибудь…" autocomplete="off" />
      <button class="ibtn" id="sendBtn" title="Отправить">➤</button>
    </div>
  </div>
</div>
<input type="file" id="fileInput" accept="image/*" hidden />

<!-- Настройки -->
<aside class="glass" id="settings">
  <h2>⚙️ Настройки</h2>
  <div class="set-row"><span>Светлая тема<small>Матовое стекло в светлых тонах</small></span><label class="switch"><input type="checkbox" id="setTheme"><span class="slider"></span></label></div>
  <div class="set-row"><span>Веб-поиск<small>Wikipedia и DuckDuckGo</small></span><label class="switch"><input type="checkbox" id="setSearch" checked><span class="slider"></span></label></div>
  <div class="set-row"><span>Память диалога<small>Сохранение в localStorage</small></span><label class="switch"><input type="checkbox" id="setMemory" checked><span class="slider"></span></label></div>
  <div class="set-row"><span>Распознавание речи<small>Голосовой ввод (микрофон)</small></span><label class="switch"><input type="checkbox" id="setVoice" checked><span class="slider"></span></label></div>
  <button id="clearMem">🗑 Очистить память диалога</button>
</aside>

<script>
"use strict";
/* ================== Хранилище ================== */
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const sess = {
  get(k){ try{ return sessionStorage.getItem(k); }catch(e){ return null; } },
  set(k, v){ try{ sessionStorage.setItem(k, v); }catch(e){} }
};
const PASSWORD = "1394";
let settings = store.get("aibot_settings", { theme:"dark", search:true, memory:true, voice:true });
if(!settings || typeof settings !== "object") settings = { theme:"dark", search:true, memory:true, voice:true };

/* ================== Тема ================== */
function applyTheme(){
  document.documentElement.setAttribute("data-theme", settings.theme === "light" ? "light" : "dark");
  const t = document.getElementById("setTheme");
  if(t) t.checked = settings.theme === "light";
}
applyTheme();

/* ================== Частицы ================== */
(function particles(){
  const cv = document.getElementById("particles"), ctx = cv.getContext("2d");
  let W, H, pts = [];
  function resize(){ W = cv.width = innerWidth; H = cv.height = innerHeight; }
  addEventListener("resize", resize); resize();
  for(let i = 0; i < 70; i++) pts.push({ x:Math.random()*W, y:Math.random()*H, r:Math.random()*2+.4, vx:(Math.random()-.5)*.25, vy:(Math.random()-.5)*.25, a:Math.random()*.5+.15 });
  (function loop(){
    ctx.clearRect(0,0,W,H);
    for(const p of pts){
      p.x += p.vx; p.y += p.vy;
      if(p.x < 0) p.x = W; if(p.x > W) p.x = 0;
      if(p.y < 0) p.y = H; if(p.y > H) p.y = 0;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = "rgba(255,255,255," + p.a + ")"; ctx.fill();
    }
    requestAnimationFrame(loop);
  })();
})();

/* ================== Экран блокировки ================== */
let pin = "";
const cells = Array.from(document.querySelectorAll(".pin-cell"));
const keypad = document.getElementById("keypad");
[1,2,3,4,5,6,7,8,9,"C",0,"⌫"].forEach(function(k){
  const b = document.createElement("button");
  b.className = "key"; b.textContent = k;
  b.addEventListener("click", function(){ pinKey(k); });
  keypad.appendChild(b);
});
function renderPin(){
  cells.forEach(function(c, i){
    c.textContent = i < pin.length ? "●" : "";
    c.classList.toggle("filled", i < pin.length);
  });
}
function pinKey(k){
  document.getElementById("lockMsg").textContent = "";
  if(k === "C"){ pin = ""; }
  else if(k === "⌫"){ pin = pin.slice(0, -1); }
  else if(pin.length < 4){ pin += String(k); }
  renderPin();
  if(pin.length === 4){
    if(pin === PASSWORD){
      openApp();
    }else{
      cells.forEach(function(c){ c.classList.add("shake"); });
      setTimeout(function(){
        cells.forEach(function(c){ c.classList.remove("shake"); });
        pin = ""; renderPin();
        document.getElementById("lockMsg").textContent = "Неверный PIN. Попробуйте снова.";
      }, 420);
    }
  }
}
let appOpened = false;
function openApp(){
  if(appOpened) return;
  appOpened = true;
  document.getElementById("lockScreen").style.display = "none";
  document.getElementById("app").classList.add("open");
  sess.set("aibot_unlocked", "1");
  if(!store.get("aibot_greeted", false)){
    botSay("Привет! 👋 Я AI Bot Premium.\n\nМогу считать математику, рассказать факты, поискать в Wikipedia (команда: «вики слово»), открыть DuckDuckGo («найди слово») и проанализировать фото — просто прикрепите изображение 📷\n\nНапишите «помощь», чтобы увидеть все команды.");
    store.set("aibot_greeted", true);
  }
  loadHistory();
}

/* ================== Чат и память ================== */
const chat = document.getElementById("chat");
function addMsg(text, who, img){
  const d = document.createElement("div");
  d.className = "msg " + who;
  if(img){ const im = document.createElement("img"); im.src = img; im.alt = "Фото"; d.appendChild(im); }
  if(text){ const s = document.createElement("span"); s.textContent = text; d.appendChild(s); }
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
  return d;
}
function saveHistory(){
  if(!settings.memory) return;
  const items = Array.from(chat.querySelectorAll(".msg")).map(function(m){
    const img = m.querySelector("img");
    const txt = m.querySelector("span") ? m.querySelector("span").textContent : "";
    return { who: m.classList.contains("user") ? "user" : "bot", text: txt, img: img ? img.src : null };
  }).slice(-80);
  store.set("aibot_history", items);
}
function loadHistory(){
  if(!settings.memory) return;
  const h = store.get("aibot_history", []);
  if(!Array.isArray(h) || !h.length) return;
  h.forEach(function(m){ if(m && (m.text || m.img)) addMsg(m.text || "", m.who === "user" ? "user" : "bot", m.img || null); });
  chat.scrollTop = chat.scrollHeight;
}
function botSay(text){
  const t = document.createElement("div");
  t.className = "typing"; t.innerHTML = "<i></i><i></i><i></i>";
  chat.appendChild(t); chat.scrollTop = chat.scrollHeight;
  setTimeout(function(){
    t.remove();
    addMsg(text, "bot");
    saveHistory();
  }, 500 + Math.random()*500);
}

/* ================== Логика бота ================== */
const KB = [
  { k:["привет","здравств","hi","hello"], r:["Привет! 😊 Рад тебя видеть. Чем помочь?","Здравствуй! Спрашивай что угодно."] },
  { k:["как дела","как ты"], r:["У меня всё отлично — переливаюсь стеклом и жду вопросов ✨","Работаю без багов (почти). А у тебя как?"] },
  { k:["кто ты","что ты"], r:["Я AI Bot Premium: умные ответы, математика, веб-поиск и анализ фото — всё в матовом стеклянном корпусе 🧠"] },
  { k:["помощь","help","команды"], r:"Команды:\n• Математика: «2 + 2 * 10» или «(5+3)^2»\n• Википедия: «вики искусственный интеллект»\n• DuckDuckGo: «найди рецепт пасты»\n• Фото: прикрепите изображение — я опишу цвета, размеры и яркость\n• Спросите: «время», «дата», «факт»" },
  { k:["время"], r:function(){ const d = new Date(); return "Сейчас " + d.toLocaleTimeString("ru-RU"); } },
  { k:["дата","число","день"], r:function(){ const d = new Date(); return "Сегодня " + d.toLocaleDateString("ru-RU", { weekday:"long", day:"numeric", month:"long", year:"numeric" }); } },
  { k:["спасибо","благодар"], r:["Пожалуйста! Обращайтесь 🤗","Всегда пожалуйста!"] },
  { k:["пока","bye"], r:["До встречи! 👋 Возвращайтесь.","Пока! Я буду тут, в стеклянной панели."] },
  { k:["тема","оформление"], r:["Настройки → «Светлая тема». Попробуйте, там тоже красиво ✨"] }
];
const FACTS = [
  "Осьминоги имеют три сердца и голубую кровь.",
  "Свет от Солнца до Земли идёт около 8 минут.",
  "Бананы — это ягоды, а клубника — нет.",
  "У медуз нет мозга и сердца.",
  "Первый в мире сайт до сих пор работает: info.cern.ch.",
  "Человеческий мозг генерирует ~20 Ватт энергии.",
  "Венера — единственная планета, вращающаяся в обратную сторону.",
  "Скорость печати в среднем 200 символов в минуту."
];
function safeMath(expr){
  const clean = expr.replace(/,/g, ".").replace(/\^/g, "**").replace(/%/g, "/100").replace(/×/g, "*").replace(/÷/g, "/");
  if(!/^[\d\s+\-*/().]*$/.test(clean) || !/\d/.test(clean) || !/[+\-*/]/.test(clean)) return null;
  try{
    const val = Function('"use strict";return(' + clean + ")")();
    if(typeof val !== "number" || !isFinite(val)) return null;
    return Math.round(val * 1e10) / 1e10;
  }catch(e){ return null; }
}
function pick(a){ return a[Math.floor(Math.random() * a.length)]; }

function handle(text){
  const q = text.trim();
  const low = q.toLowerCase();

  if(/(^|\s)факт($|\s|!)/.test(low)) return botSay(pick(FACTS));

  const math = safeMath(q);
  if(math !== null) return botSay("🧮 " + q + " = " + math);

  const wiki = low.match(/^\s*(?:вики|wiki)\s+(.+)$/i);
  if(wiki) return wikiSearch(wiki[1]);

  const ddg = low.match(/^\s*(?:найди|поиск|google|duck|ddg)\s+(.+)$/i);
  if(ddg) return ddgSearch(ddg[1]);

  for(const item of KB){
    if(item.k.some(function(k){ return low.includes(k); })){
      const r = typeof item.r === "function" ? item.r() : pick(item.r);
      return botSay(r);
    }
  }
  botSay("Хм, про «" + q + "» у меня нет готового ответа. Попробуйте:\n• «вики " + q + "» — поиск в Википедии\n• «найди " + q + "» — DuckDuckGo\n• или напишите «помощь».");
}

/* ================== Поиск ================== */
function wikiSearch(term){
  if(!settings.search) return botSay("Веб-поиск отключён в настройках ⚙️");
  botSay("🔍 Ищу в Википедии: " + term + "…");
  fetch("https://ru.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(term))
    .then(function(r){ if(!r.ok) throw new Error("not found"); return r.json(); })
    .then(function(d){
      const info = (d.extract || "Статья найдена, но без описания.").slice(0, 600);
      addMsg("📖 " + (d.title || term) + "\n\n" + info + (d.content_urls && d.content_urls.desktop ? "\n\n" + d.content_urls.desktop.page : ""), "bot");
      saveHistory();
    })
    .catch(function(){ addMsg("😕 По запросу «" + term + "» ничего не нашлось в Википедии. Попробуйте переформулировать.", "bot"); saveHistory(); });
}
function ddgSearch(term){
  if(!settings.search) return botSay("Веб-поиск отключён в настройках ⚙️");
  const url = "https://duckduckgo.com/?q=" + encodeURIComponent(term);
  addMsg("🦆 Открываю DuckDuckGo: «" + term + "»\n" + url, "bot");
  saveHistory();
  window.open(url, "_blank");
}

/* ================== Анализ фото ================== */
document.getElementById("attachBtn").addEventListener("click", function(){ document.getElementById("fileInput").click(); });
document.getElementById("fileInput").addEventListener("change", function(e){
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  if(!f.type.startsWith("image/")) return botSay("Это не изображение — пришлите фото 📷");
  const reader = new FileReader();
  reader.onload = function(){
    const url = reader.result;
    addMsg("Прикреплённое фото:", "user", url);
    const img = new Image();
    img.onload = function(){
      const cv = document.createElement("canvas");
      const scale = Math.min(1, 160 / Math.max(img.width, img.height));
      cv.width = Math.max(1, Math.round(img.width * scale));
      cv.height = Math.max(1, Math.round(img.height * scale));
      const ctx = cv.getContext("2d");
      ctx.drawImage(img, 0, 0, cv.width, cv.height);
      const data = ctx.getImageData(0, 0, cv.width, cv.height).data;
      let r = 0, g = 0, b = 0, lum = 0;
      const buckets = {};
      const step = Math.max(4, Math.floor(data.length / 4 / 5000));
      for(let i = 0; i < data.length; i += 4 * step){
        const pr = data[i], pg = data[i+1], pb = data[i+2];
        r += pr; g += pg; b += pb;
        lum += 0.2126 * pr + 0.7152 * pg + 0.0722 * pb;
        const key = (pr >> 4) + "," + (pg >> 4) + "," + (pb >> 4);
        buckets[key] = (buckets[key] || 0) + 1;
      }
      const n = Math.ceil(data.length / (4 * step));
      r = Math.round(r / n); g = Math.round(g / n); b = Math.round(b / n);
      lum = Math.round(lum / n);
      const top = Object.keys(buckets).sort(function(a, bb){ return buckets[bb] - buckets[a]; }).slice(0, 3)
        .map(function(k){ const c = k.split(",").map(function(v){ return Math.min(255, (parseInt(v, 10) << 4) + 8); }); return { rgb:c, hex:"#" + c.map(function(v){ return v.toString(16).padStart(2, "0"); }).join("") }; });
      const brightness = lum < 70 ? "тёмное 🌙" : lum < 160 ? "средней яркости ☁️" : "яркое ☀️";
      const hex = "#" + [r,g,b].map(function(v){ return v.toString(16).padStart(2, "0"); }).join("");
      botSay("📸 Анализ фото:\n• Размер: " + img.width + " × " + img.height + " px\n• Средний цвет: rgb(" + r + ", " + g + ", " + b + ") " + hex + "\n• Яркость: " + lum + "/255 — " + brightness + "\n• Доминирующие цвета:\n" + top.map(function(t){ return "  " + t.hex + " — rgb(" + t.rgb.join(", ") + ")"; }).join("\n"));
    };
    img.onerror = function(){ botSay("😕 Не удалось прочитать изображение."); };
    img.src = url;
  };
  reader.onerror = function(){ botSay("😕 Ошибка чтения файла."); };
  reader.readAsDataURL(f);
  e.target.value = "";
});

/* ================== Ввод ================== */
const input = document.getElementById("input");
function send(){
  const v = input.value.trim();
  if(!v) return;
  input.value = "";
  addMsg(v, "user");
  saveHistory();
  handle(v);
}
document.getElementById("sendBtn").addEventListener("click", send);
input.addEventListener("keydown", function(e){ if(e.key === "Enter") send(); });

/* ================== Распознавание речи ================== */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
document.getElementById("micBtn").addEventListener("click", function(){
  if(!settings.voice) return botSay("Голосовой ввод отключён в настройках ⚙️");
  if(!SR) return botSay("😕 Ваш браузер не поддерживает распознавание речи.");
  if(rec){ try{ rec.stop(); }catch(e){} rec = null; return; }
  rec = new SR();
  rec.lang = "ru-RU";
  rec.interimResults = false;
  rec.onresult = function(e){
    const t = e.results[0][0].transcript;
    input.value = t;
    send();
  };
  rec.onerror = function(){ botSay("😕 Не удалось распознать речь. Проверьте микрофон."); };
  rec.onend = function(){ rec = null; };
  try{ rec.start(); }catch(e){ rec = null; }
});

/* ================== Настройки ================== */
const panel = document.getElementById("settings");
document.getElementById("openSettings").addEventListener("click", function(){ panel.classList.toggle("open"); });
function bindSetting(id, key, cb){
  const el = document.getElementById(id);
  if(!el) return;
  el.checked = !!settings[key];
  el.addEventListener("change", function(){
    settings[key] = el.checked;
    store.set("aibot_settings", settings);
    if(cb) cb();
  });
}
bindSetting("setTheme", "theme", function(){ settings.theme = document.getElementById("setTheme").checked ? "light" : "dark"; store.set("aibot_settings", settings); applyTheme(); });
document.getElementById("setTheme").checked = settings.theme === "light";
bindSetting("setSearch", "search");
bindSetting("setMemory", "memory", function(){ if(!settings.memory) store.del("aibot_history"); });
bindSetting("setVoice", "voice");
document.getElementById("clearMem").addEventListener("click", function(){
  store.del("aibot_history");
  chat.innerHTML = "";
  botSay("🗑 Память очищена. Начнём с чистого листа!");
});

/* ================== Автовход ================== */
if(sess.get("aibot_unlocked") === "1") openApp();
