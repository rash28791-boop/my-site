<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#09090b">
<title>Glass Messenger</title>
<style>
  *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  /* ================= ТЕМЫ ================= */
  :root{
    /* Глубокая темная тема */
    --bg1:#18181b;  --bg2:#09090b;
    --blob1:#4338ca; --blob2:#0f766e; 
    --text:#f4f4f5; --text-dim:rgba(244, 244, 245, 0.55);
    
    /* Стекло: полупрозрачное, матовое */
    --glass: rgba(255, 255, 255, 0.04);
    --glass-2: rgba(255, 255, 255, 0.08);
    --glass-3: rgba(255, 255, 255, 0.12);
    --stroke: rgba(255, 255, 255, 0.1);
    
    --accent: #6366f1;
    --font-size: 16px;
    --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  
  [data-theme="light"]{
    --bg1:#e2e8f0;  --bg2:#f8fafc;
    --blob1:#a5b4fc; --blob2:#99f6e4;
    --text:#0f172a; --text-dim:rgba(15, 23, 42, 0.6);
    
    --glass: rgba(255, 255, 255, 0.5);
    --glass-2: rgba(255, 255, 255, 0.7);
    --glass-3: rgba(255, 255, 255, 0.9);
    --stroke: rgba(0, 0, 0, 0.08);
    
    --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
  }

  html, body { height:100%; margin:0; overscroll-behavior:none; }
  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: var(--font-size);
    color: var(--text);
    overflow:hidden;
    -webkit-font-smoothing: antialiased;
  }
  ::-webkit-scrollbar{ width:0; height:0; }

  /* ================= ФОН ================= */
  .bg{
    position:fixed; inset:0; z-index:-1; overflow:hidden;
    background: linear-gradient(145deg, var(--bg1), var(--bg2));
    transition: background .5s ease;
  }
  .bg::before, .bg::after{
    content:""; position:absolute; width:90vmax; height:90vmax; border-radius:50%;
    filter: blur(100px); opacity:.15; /* Приглушили яркость */
    transition: background .4s, opacity .4s;
    animation: float 20s ease-in-out infinite alternate;
  }
  .bg::before{ background: var(--blob1); top:-20vmax; left:-20vmax; }
  .bg::after { background: var(--blob2); bottom:-20vmax; right:-20vmax; animation-delay:-10s; }
  [data-theme="light"] .bg::before,
  [data-theme="light"] .bg::after{ opacity:.4; }
  
  @keyframes float{
    from{ transform: translate(0,0) scale(1); }
    to  { transform: translate(10vmax,10vmax) scale(1.1); }
  }

  /* ================= СТЕКЛО ================= */
  .glass{
    background: var(--glass);
    -webkit-backdrop-filter: blur(24px) saturate(150%);
    backdrop-filter: blur(24px) saturate(150%);
    border: 1px solid var(--stroke);
    box-shadow: var(--shadow);
  }

  /* ================= ЭКРАНЫ ================= */
  .screen{ position:fixed; inset:0; display:none; }
  .screen.active{ display:flex; }
  
  #authScreen.active{
    align-items:center; justify-content:center;
    padding: calc(20px + var(--safe-t)) 20px calc(20px + var(--safe-b));
    overflow:auto;
  }
  
  #appScreen.active{ 
    flex-direction:column; 
    height: 100vh; 
    height: 100dvh; /* Динамическая высота для мобильных браузеров */
  }

  /* ================= АВТОРИЗАЦИЯ ================= */
  .auth-card{
    width:min(400px, 100%);
    border-radius: 28px;
    padding:32px 24px;
    display:flex; flex-direction:column; gap:20px;
    animation: pop .5s cubic-bezier(.2,.9,.3,1.1);
  }
  @keyframes pop{ from{ opacity:0; transform: translateY(20px) scale(.95); } }

  .brand{ display:flex; gap:16px; align-items:center; margin-bottom:8px; }
  .logo{
    width:56px; height:56px; border-radius:16px; display:grid; place-items:center;
    font-size:1.6em; color:#fff; flex:0 0 auto;
    background: linear-gradient(135deg, var(--accent), var(--blob2));
    box-shadow: 0 8px 24px color-mix(in srgb, var(--accent) 40%, transparent);
  }
  .brand h1{ margin:0; font-size:1.3em; font-weight:700; letter-spacing:-0.5px; }
  .brand p{ margin:4px 0 0; font-size:.8em; color: var(--text-dim); }

  .tabs{
    display:flex; gap:6px; padding:6px; border-radius:16px;
    background: var(--glass-2); border:1px solid var(--stroke);
  }
  .tabs button{
    flex:1; padding:12px; border:0; border-radius:12px; cursor:pointer;
    background:transparent; color:var(--text-dim); font:inherit;
    font-size:.95em; font-weight:600; transition:.3s;
  }
  .tabs button.active{ background: var(--glass-3); color:var(--text); box-shadow:0 4px 12px rgba(0,0,0,.1); }

  .field{ display:flex; flex-direction:column; gap:8px; position:relative; }
  .field span{ font-size:.85em; color: var(--text-dim); padding-left:6px; font-weight:500; }
  .field input{
    padding:16px; border-radius:16px; font:inherit; outline:none; min-height:52px;
    border:1px solid var(--stroke); background: var(--glass); color: var(--text);
    transition:.2s; width:100%;
    font-size:16px; /* Предотвращает зум на iOS */
  }
  .field input:focus{
    border-color: var(--accent);
    background: var(--glass-2);
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 20%, transparent);
  }
  
  /* Кнопка показа пароля */
  .pwd-toggle {
    position: absolute; right: 16px; bottom: 14px;
    background: none; border: none; cursor: pointer;
    color: var(--text-dim); font-size: 1.2em; padding: 4px;
  }

  .btn{
    padding:16px; border-radius:16px; cursor:pointer; font:inherit;
    border:1px solid var(--stroke); background: var(--glass-2); color: var(--text);
    transition:.2s; min-height:54px; font-weight:600; font-size:1em;
  }
  .btn:active{ transform: scale(.97); }
  .btn.primary{
    background: var(--accent); color:#fff; border-color:transparent;
    box-shadow: 0 8px 20px color-mix(in srgb, var(--accent) 30%, transparent);
  }

  .msg{ margin:0; min-height:1.2em; font-size:.85em; color:#f87171; text-align:center; font-weight:500; }
  .msg.ok{ color:#4ade80; }

  /* ================= ПРИЛОЖЕНИЕ ================= */
  
  /* Шапка */
  .topbar{
    flex:0 0 auto;
    display:flex; align-items:center; gap:14px;
    padding: calc(12px + var(--safe-t)) 16px 12px;
    background: var(--glass);
    -webkit-backdrop-filter: blur(24px);
    backdrop-filter: blur(24px);
    border-bottom: 1px solid var(--stroke);
    z-index: 10;
  }
  .topbar .avatar{
    width:44px; height:44px; border-radius:50%; display:grid; place-items:center;
    font-weight:700; color:#fff; font-size:1.1em;
    background: linear-gradient(135deg, var(--accent), var(--blob2));
    box-shadow: 0 4px 12px color-mix(in srgb, var(--accent) 30%, transparent);
  }
  .topbar-info{ flex:1; min-width:0; }
  .topbar-info .name{
    font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:1.05em;
  }
  .topbar-info .status{
    font-size:.8em; color: var(--text-dim); margin-top:2px;
    display:flex; align-items:center; gap:6px;
  }
  .topbar-info .status::before{
    content:""; width:8px; height:8px; border-radius:50%; background:#22c55e;
    box-shadow: 0 0 8px #22c55e;
  }

  /* Контентная часть */
  .main-content {
    flex: 1;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .view{
    position: absolute; inset: 0; display: none; flex-direction: column;
  }
  .view.active{ display: flex; animation: fadeIn .3s ease; }
  @keyframes fadeIn{ from{ opacity:0; transform: translateY(10px); } }

  /* --- Чат --- */
  .chat-scroll{
    flex:1; overflow-y:auto; -webkit-overflow-scrolling: touch;
    display:flex; flex-direction:column; gap:12px;
    padding: 20px 16px;
  }
  .bubble{
    max-width:85%; padding:14px 18px; border-radius:20px;
    background: var(--glass-2); border:1px solid var(--stroke);
    align-self:flex-start;
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    animation: slideUp .3s ease;
    font-size:.95em; line-height:1.4;
    word-wrap: break-word; overflow-wrap: anywhere;
  }
  @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } }
  
  .bubble.me{
    align-self:flex-end;
    background: var(--accent); color:#fff; border-color:transparent;
    border-bottom-right-radius: 6px;
    box-shadow: 0 4px 15px color-mix(in srgb, var(--accent) 25%, transparent);
  }
  .bubble:not(.me){ border-bottom-left-radius: 6px; }
  .bubble-time{ font-size:.7em; opacity:.6; margin-top:6px; text-align:right; }

  /* Поле ввода */
  .composer{
    flex:0 0 auto;
    display:flex; gap:10px; align-items:center;
    padding: 12px 16px calc(12px + var(--safe-b));
    background: var(--glass);
    -webkit-backdrop-filter: blur(24px);
    backdrop-filter: blur(24px);
    border-top: 1px solid var(--stroke);
  }
  .composer input{
    flex:1; padding:14px 20px; border-radius:24px; font:inherit; outline:none;
    border:1px solid var(--stroke); background: var(--glass-2); color: var(--text);
    min-height:50px; font-size:16px;
  }
  .composer input:focus{ border-color: var(--accent); background: var(--glass-3); }
  
  .send-btn{
    width:50px; height:50px; border-radius:50%; border:none; cursor:pointer;
    background: var(--accent); color:#fff; font-size:1.2em;
    display:grid; place-items:center; flex:0 0 auto; transition:.2s;
    box-shadow: 0 4px 12px color-mix(in srgb, var(--accent) 30%, transparent);
  }
  .send-btn:active{ transform: scale(.9); }

  /* --- Настройки --- */
  .settings-scroll{
    flex:1; overflow-y:auto; -webkit-overflow-scrolling: touch;
    padding: 16px 16px 40px;
    display:flex; flex-direction:column; gap:16px;
  }
  .group{
    padding:20px 16px; border-radius:22px; display:flex; flex-direction:column; gap:16px;
    background: var(--glass); border:1px solid var(--stroke);
    -webkit-backdrop-filter: blur(18px);
    backdrop-filter: blur(18px);
  }
  .group-title{
    font-size:.75em; text-transform:uppercase; letter-spacing:.08em;
    color: var(--text-dim); font-weight:700;
  }
  .row{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    min-height:44px;
  }
  .row-text{ flex:1; min-width:0; }
  .row-title{ font-weight:600; font-size:.95em; }
  .row-sub{ font-size:.8em; color: var(--text-dim); margin-top:4px; line-height:1.3; }
  .row.col{ flex-direction:column; align-items:stretch; gap:12px; }

  .segmented{
    display:flex; gap:4px; padding:5px; border-radius:14px;
    background: var(--glass-2); border:1px solid var(--stroke);
    width:100%;
  }
  .segmented button{
    flex:1; border:0; background:transparent; color: var(--text-dim); font:inherit;
    font-size:.85em; padding:10px 4px; border-radius:10px; cursor:pointer;
    transition:.2s; font-weight:600;
  }
  .segmented button.active{ background: var(--glass-3); color:var(--text); box-shadow:0 2px 8px rgba(0,0,0,.1); }

  .swatches{ display:flex; gap:12px; padding:4px 0; justify-content:space-between; }
  .swatches button{
    width:44px; height:44px; border-radius:50%; cursor:pointer; padding:0;
    border:3px solid transparent; background: var(--c); transition:.2s;
    flex:1; max-width:48px;
  }
  .swatches button:active{ transform: scale(.9); }
  .swatches button.active{
    border-color: var(--text);
    box-shadow: 0 0 0 2px var(--bg1);
  }

  input[type="range"]{
    width:100%; accent-color: var(--accent); cursor:pointer;
    height:36px;
  }

  .switch{ position:relative; display:inline-block; width:54px; height:32px; flex:0 0 auto; }
  .switch input{ position:absolute; inset:0; opacity:0; margin:0; cursor:pointer; z-index:2; }
  .switch span{
    position:absolute; inset:0; border-radius:99px; transition:.3s;
    background: var(--glass-2); border:1px solid var(--stroke);
  }
  .switch span::after{
    content:""; position:absolute; top:2px; left:2px; width:26px; height:26px;
    border-radius:50%; background: var(--text-dim); transition:.3s;
  }
  .switch input:checked + span{ background: var(--accent); border-color:transparent; }
  .switch input:checked + span::after{ transform: translateX(22px); background:#fff; }

  .logout-btn{
    width:100%; padding:16px; border-radius:16px; font:inherit; font-weight:600;
    border:1px solid color-mix(in srgb, #ef4444 30%, transparent); 
    background: color-mix(in srgb, #ef4444 10%, transparent);
    color:#ef4444; cursor:pointer; transition:.2s; min-height:54px;
    margin-top:10px;
  }
  .logout-btn:active{ transform: scale(.98); background: color-mix(in srgb, #ef4444 20%, transparent); }

  /* ================= НИЖНЯЯ НАВИГАЦИЯ ================= */
  .bottom-nav{
    flex:0 0 auto; 
    display:flex; justify-content:space-around; align-items:center;
    padding: 8px 12px calc(8px + var(--safe-b));
    background: var(--glass-3);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    backdrop-filter: blur(24px) saturate(180%);
    border-top: 1px solid var(--stroke);
    z-index: 10;
  }
  .nav-btn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
    padding: 8px 4px; border:0; background:transparent; color: var(--text-dim);
    font:inherit; cursor:pointer; border-radius:16px; transition:.2s;
    min-height:56px; justify-content:center;
  }
  .nav-btn .nav-icon{ font-size:1.4em; line-height:1; transition: transform .2s; }
  .nav-btn .nav-label{ font-size:.75em; font-weight:600; }
  .nav-btn.active{ color: var(--accent); }
  .nav-btn.active .nav-icon{ transform: translateY(-2px); }
  .nav-btn:active{ transform: scale(.95); }
</style>
</head>
<body>

<div class="bg"></div>

<!-- ============ ЭКРАН ВХОДА / РЕГИСТРАЦИИ ============ -->
<div class="screen active" id="authScreen">
  <div class="glass auth-card">
    <div class="brand">
      <div class="logo">◈</div>
      <div>
        <h1>Glass Messenger</h1>
        <p>Безопасно. Стильно. Удобно.</p>
      </div>
    </div>

    <div class="tabs">
      <button class="active" data-tab="login" type="button">Вход</button>
      <button data-tab="register" type="button">Регистрация</button>
    </div>

    <form id="authForm" style="display:flex;flex-direction:column;gap:16px">
      <label class="field">
        <span>Никнейм</span>
        <input id="nick" type="text" placeholder="Придумайте никнейм" autocomplete="username" required>
      </label>
      <label class="field">
        <span>Пароль</span>
        <input id="pass" type="password" placeholder="••••••" autocomplete="current-password" required>
        <button type="button" class="pwd-toggle" id="togglePass">👁️</button>
      </label>
      <label class="field" id="pass2Wrap" style="display:none">
        <span>Повторите пароль</span>
        <input id="pass2" type="password" placeholder="••••••">
      </label>
      <button class="btn primary" id="authSubmit" type="submit">Войти в систему</button>
    </form>

    <p class="msg" id="authMsg"></p>
  </div>
</div>

<!-- ============ ПРИЛОЖЕНИЕ ============ -->
<div class="screen" id="appScreen">

  <!-- Шапка -->
  <header class="topbar">
    <div class="avatar" id="avatar">?</div>
    <div class="topbar-info">
      <div class="name" id="userName">Гость</div>
      <div class="status">в сети</div>
    </div>
  </header>

  <!-- Контент -->
  <div class="main-content">

    <!-- ЧАТЫ -->
    <section class="view active" id="view-chats">
      <div class="chat-scroll" id="chatScroll"></div>
      <form class="composer" id="composer">
        <input id="msgInput" type="text" placeholder="Сообщение..." autocomplete="off">
        <button class="send-btn" type="submit" aria-label="Отправить">➤</button>
      </form>
    </section>

    <!-- НАСТРОЙКИ -->
    <section class="view" id="view-settings">
      <div class="settings-scroll">

        <div class="group">
          <div class="group-title">Оформление</div>

          <div class="row col">
            <div class="row-text">
              <div class="row-title">Тема приложения</div>
            </div>
            <div class="segmented" id="themeSeg">
              <button type="button" data-value="dark">Тёмная</button>
              <button type="button" data-value="light">Светлая</button>
              <button type="button" data-value="system">Авто</button>
            </div>
          </div>

          <div class="row col">
            <div class="row-text">
              <div class="row-title">Акцентный цвет</div>
            </div>
            <div class="swatches" id="accentSwatches">
              <button type="button" data-color="#6366f1" style="--c:#6366f1"></button>
              <button type="button" data-color="#06b6d4" style="--c:#06b6d4"></button>
              <button type="button" data-color="#22c55e" style="--c:#22c55e"></button>
              <button type="button" data-color="#f59e0b" style="--c:#f59e0b"></button>
              <button type="button" data-color="#ec4899" style="--c:#ec4899"></button>
            </div>
          </div>

          <div class="row col">
            <div class="row-text">
              <div class="row-title">Размер шрифта</div>
              <div class="row-sub"><span id="fontSizeVal">16</span> px</div>
            </div>
            <input type="range" id="fontSize" min="12" max="20" step="1">
          </div>
        </div>

        <div class="group">
          <div class="group-title">Уведомления</div>

          <div class="row">
            <div class="row-text">
              <div class="row-title">Push-уведомления</div>
            </div>
            <label class="switch"><input type="checkbox" id="optNotify"><span></span></label>
          </div>

          <div class="row">
            <div class="row-text">
              <div class="row-title">Звук сообщений</div>
            </div>
            <label class="switch"><input type="checkbox" id="optSound"><span></span></label>
          </div>
        </div>

        <button class="logout-btn" id="logout" type="button">Выйти из аккаунта</button>

      </div>
    </section>

  </div>

  <!-- Нижняя навигация -->
  <nav class="bottom-nav">
    <button class="nav-btn active" data-view="chats" type="button">
      <span class="nav-icon">💬</span>
      <span class="nav-label">Чаты</span>
    </button>
    <button class="nav-btn" data-view="settings" type="button">
      <span class="nav-icon">⚙️</span>
      <span class="nav-label">Настройки</span>
    </button>
  </nav>

</div>

<script>
/* ==================== ХРАНИЛИЩЕ ==================== */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

const K = { users: 'gm_users', session: 'gm_session', settings: 'gm_settings' };
const readJSON  = (k, def) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? def; } catch { return def; } };
const writeJSON = (k, v) => localStorage.setItem(k, JSON.stringify(v));

/* ==================== НАСТРОЙКИ ==================== */
const DEFAULT_SETTINGS = {
  theme: 'dark',
  accent: '#6366f1',
  fontSize: 16,
  notify: true,
  sound: true
};
let settings = Object.assign({}, DEFAULT_SETTINGS, readJSON(K.settings, {}));

const prefersLight = () => window.matchMedia('(prefers-color-scheme: light)').matches;

function applySettings() {
  const theme = settings.theme === 'system'
    ? (prefersLight() ? 'light' : 'dark')
    : settings.theme;

  document.documentElement.dataset.theme = theme;
  document.documentElement.style.setProperty('--accent', settings.accent);
  document.documentElement.style.setProperty('--font-size', settings.fontSize + 'px');

  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = theme === 'light' ? '#f8fafc' : '#09090b';
}

function syncSettingsUI() {
  $$('#themeSeg button').forEach(b =>
    b.classList.toggle('active', b.dataset.value === settings.theme));

  $$('#accentSwatches button').forEach(b =>
    b.classList.toggle('active', b.dataset.color.toLowerCase() === settings.accent.toLowerCase()));

  $('#fontSize').value = settings.fontSize;
  $('#fontSizeVal').textContent = settings.fontSize;

  $('#optNotify').checked  = settings.notify;
  $('#optSound').checked   = settings.sound;
}

function commit() {
  applySettings();
  syncSettingsUI();
  writeJSON(K.settings, settings);
}

/* ==================== АВТОРИЗАЦИЯ ==================== */
let mode = 'login';

// Переключение вкладок Вход/Регистрация
$$('.tabs button').forEach(btn => btn.addEventListener('click', () => {
  mode = btn.dataset.tab;
  $$('.tabs button').forEach(b => b.classList.toggle('active', b === btn));
  $('#pass2Wrap').style.display = mode === 'register' ? 'flex' : 'none';
  $('#authSubmit').textContent = mode === 'register' ? 'Создать аккаунт' : 'Войти в систему';
  showMsg('');
}));

// Показать/скрыть пароль
$('#togglePass').addEventListener('click', () => {
  const pwd = $('#pass');
  if (pwd.type === 'password') {
    pwd.type = 'text';
    $('#togglePass').textContent = '🙈';
  } else {
    pwd.type = 'password';
    $('#togglePass').textContent = '👁️';
  }
});

function hash(str) {
  let h = 5381;
  for (let i = 0; i < str.length; i++) h = ((h << 5) + h) ^ str.charCodeAt(i);
  return (h >>> 0).toString(16);
}

function showMsg(text, type = 'err') {
  const el = $('#authMsg');
  el.textContent = text;
  el.className = 'msg ' + type;
}

$('#authForm').addEventListener('submit', e => {
  e.preventDefault();

  const nick  = $('#nick').value.trim();
  const pass  = $('#pass').value;
  const pass2 = $('#pass2').value;

  if (nick.length < 3) { showMsg('Никнейм должен быть от 3 символов'); return; }
  if (pass.length < 4) { showMsg('Пароль должен быть от 4 символов'); return; }

  const users = readJSON(K.users, {});
  const key = nick.toLowerCase();

  if (mode === 'register') {
    if (pass !== pass2)    { showMsg('Пароли не совпадают'); return; }
    if (users[key])        { showMsg('Этот никнейм уже занят'); return; }

    users[key] = { nick, pass: hash(nick + ':' + pass) };
    writeJSON(K.users, users);
    showMsg('Успех! Заходим...', 'ok');
    setTimeout(() => startSession(nick), 600);

  } else {
    const u = users[key];
    if (!u || u.pass !== hash(nick + ':' + pass)) {
      showMsg('Неверный никнейм или пароль');
      return;
    }
    startSession(u.nick);
  }
});

function startSession(nick) {
  writeJSON(K.session, { nick, at: Date.now() });

  $('#userName').textContent = nick;
  $('#avatar').textContent   = nick[0].toUpperCase();

  $('#authScreen').classList.remove('active');
  $('#appScreen').classList.add('active');

  $('#authForm').reset();
  showMsg('');
  renderChat();
  switchView('chats');
}

function logout() {
  localStorage.removeItem(K.session);
  $('#appScreen').classList.remove('active');
  $('#authScreen').classList.add('active');
  showMsg('');
}

/* ==================== ЧАТ ==================== */
const messages = [
  { me: false, text: 'Привет! Это обновленный интерфейс. Теперь ввод сообщений работает корректно 👋', time: '12:00' },
  { me: false, text: 'Цвета стали более спокойными, а стекло — по-настоящему матовым.', time: '12:01' }
];

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => (
    { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]
  ));
}

function renderChat() {
  const box = $('#chatScroll');
  box.innerHTML = messages.map(m => `
    <div class="bubble ${m.me ? 'me' : ''}">
      <div>${escapeHtml(m.text)}</div>
      <div class="bubble-time">${m.time}</div>
    </div>`).join('');
  box.scrollTop = box.scrollHeight;
}

$('#composer').addEventListener('submit', e => {
  e.preventDefault();
  const input = $('#msgInput');
  const text = input.value.trim();
  if (!text) return;

  messages.push({
    me: true,
    text,
    time: new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' })
  });
  input.value = '';
  // Не фокусируемся принудительно, чтобы избежать рывков на мобильных
  renderChat();
});

/* ==================== НАВИГАЦИЯ ==================== */
function switchView(view) {
  $$('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  $$('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + view));
  
  // Если переключаемся в чат, прокручиваем вниз
  if (view === 'chats') {
    setTimeout(() => {
      const box = $('#chatScroll');
      if (box) box.scrollTop = box.scrollHeight;
    }, 50);
  }
}

$$('.nav-btn').forEach(btn => btn.addEventListener('click', () => switchView(btn.dataset.view)));

/* ==================== ОБРАБОТЧИКИ НАСТРОЕК ==================== */
$$('#themeSeg button').forEach(b => b.addEventListener('click', () => {
  settings.theme = b.dataset.value;
  commit();
}));

$$('#accentSwatches button').forEach(b => b.addEventListener('click', () => {
  settings.accent = b.dataset.color;
  commit();
}));

$('#fontSize').addEventListener('input', e => {
  settings.fontSize = +e.target.value;
  commit();
});

$('#optNotify').addEventListener('change',  e => { settings.notify   = e.target.checked; commit(); });
$('#optSound').addEventListener('change',   e => { settings.sound    = e.target.checked; commit(); });

$('#logout').addEventListener('click', logout);

window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if (settings.theme === 'system') applySettings();
});

/* ==================== СТАРТ ==================== */
applySettings();
syncSettingsUI();
renderChat();

const session = readJSON(K.session, null);
if (session && session.nick) startSession(session.nick);
</script>
