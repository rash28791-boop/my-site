<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f1015">
<title>Glass Messenger</title>
<style>
  *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  /* ================= ТЕМЫ ================= */
  :root{
    --bg-main:#0f1015;
    --bg-header:rgba(20, 21, 28, 0.85);
    --text:#ffffff;
    --text-dim:#8e8e93;
    
    --bubble-in:#1c1d24;
    --bubble-out:linear-gradient(135deg, #6366f1, #8b5cf6);
    --bubble-text-out:#ffffff;
    
    --glass:rgba(255, 255, 255, 0.05);
    --glass-hover:rgba(255, 255, 255, 0.1);
    --stroke:rgba(255, 255, 255, 0.08);
    
    --accent:#6366f1;
    --font-size:16px;
    
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  
  [data-theme="light"]{
    --bg-main:#f2f4f8;
    --bg-header:rgba(255, 255, 255, 0.85);
    --text:#000000;
    --text-dim:#8e8e93;
    
    --bubble-in:#ffffff;
    --bubble-out:linear-gradient(135deg, #6366f1, #8b5cf6);
    --bubble-text-out:#ffffff;
    
    --glass:rgba(0, 0, 0, 0.05);
    --glass-hover:rgba(0, 0, 0, 0.08);
    --stroke:rgba(0, 0, 0, 0.08);
  }

  html, body { height:100%; margin:0; overscroll-behavior:none; background: var(--bg-main); }
  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: var(--font-size);
    color: var(--text);
    overflow:hidden;
    -webkit-font-smoothing: antialiased;
  }
  ::-webkit-scrollbar{ width:0; height:0; }

  /* ================= ЭКРАНЫ ================= */
  .screen{ position:fixed; inset:0; display:none; flex-direction:column; }
  .screen.active{ display:flex; }
  
  #authScreen{ align-items:center; justify-content:center; padding: 20px; background: var(--bg-main); z-index: 200; }
  
  /* ================= АВТОРИЗАЦИЯ ================= */
  .auth-card{
    width:100%; max-width: 400px;
    background: var(--bubble-in);
    border-radius: 28px; padding: 32px 24px;
    border: 1px solid var(--stroke);
    display:flex; flex-direction:column; gap:20px;
    animation: slideUp .4s ease;
  }
  @keyframes slideUp{ from{ opacity:0; transform: translateY(20px); } }

  .brand{ display:flex; gap:16px; align-items:center; margin-bottom: 10px; }
  .logo{
    width:56px; height:56px; border-radius:16px; display:grid; place-items:center;
    font-size:1.6em; color:#fff;
    background: var(--bubble-out);
    box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
  }
  .brand h1{ margin:0; font-size:1.4em; font-weight: 700; }
  .brand p{ margin:4px 0 0; font-size:.85em; color: var(--text-dim); }

  .tabs{ display:flex; background: var(--glass); border-radius:14px; padding:4px; }
  .tabs button{
    flex:1; padding:10px; border:0; border-radius:10px; background:transparent;
    color:var(--text-dim); font:inherit; font-size:.95em; font-weight:600; cursor:pointer; transition:.3s;
  }
  .tabs button.active{ background: var(--glass-hover); color:var(--text); }

  .field{ position: relative; display:flex; flex-direction:column; gap:8px; }
  .field input{
    width: 100%; padding:16px; border-radius:16px; font:inherit; font-size:16px;
    border:1px solid var(--stroke); background: var(--glass); color: var(--text);
    outline:none; transition:.2s;
  }
  .field input:focus{ border-color: var(--accent); background: var(--glass-hover); }
  
  .pwd-toggle {
    position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; font-size: 1.2em; color: var(--text-dim);
  }

  .btn{
    padding:16px; border-radius:16px; font:inherit; font-size:1em; font-weight:600;
    border:none; cursor:pointer; transition:.2s; display:flex; justify-content:center; align-items:center;
  }
  .btn.primary{ background: var(--bubble-out); color:#fff; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3); }
  .btn:active{ transform: scale(.97); }

  .msg{ margin:0; font-size:.85em; color:#ef4444; text-align:center; min-height: 1.2em; }
  .msg.ok{ color:#22c55e; }

  /* ================= ПРИЛОЖЕНИЕ ================= */
  #appScreen { background: var(--bg-main); height: 100vh; height: 100dvh; }
  
  /* Основная область контента */
  .main-content { flex: 1; position: relative; overflow: hidden; display: flex; }
  
  .tab-view {
    position: absolute; inset: 0; display: none; flex-direction: column;
    animation: fadeIn .3s ease;
  }
  .tab-view.active { display: flex; }
  @keyframes fadeIn{ from{ opacity:0; } }

  /* Шапка главной */
  .main-header {
    padding: calc(12px + var(--safe-t)) 16px 12px;
    display: flex; align-items: center; justify-content: space-between;
    background: var(--bg-main);
  }
  .main-header h2 { margin:0; font-size: 1.5em; font-weight: 700; letter-spacing: -0.5px; }

  /* --- СПИСОК ЧАТОВ --- */
  .list-scroll { flex: 1; overflow-y: auto; padding: 0 8px; }
  
  .chat-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px; border-radius: 16px; cursor: pointer;
    transition: background .2s;
  }
  .chat-item:active { background: var(--glass); }
  
  .avatar {
    width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center;
    font-weight: 600; font-size: 1.2em; color: #fff; flex-shrink: 0;
    background: var(--bubble-out);
  }
  .avatar.gray { background: #333; }
  .avatar.green { background: #22c55e; }
  
  .chat-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .chat-top { display: flex; justify-content: space-between; align-items: baseline; }
  .chat-name { font-weight: 600; font-size: 1.05em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-time { font-size: 0.75em; color: var(--text-dim); flex-shrink: 0; }
  .chat-bottom { display: flex; justify-content: space-between; align-items: center; }
  .chat-last { font-size: 0.9em; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-badge {
    background: var(--accent); color: white; font-size: 0.7em; font-weight: 700;
    padding: 2px 6px; border-radius: 10px; flex-shrink: 0;
  }

  /* ================= ЭКРАН ЧАТА (TELEGRAM STYLE) ================= */
  #chatScreen {
    position: fixed; inset: 0; z-index: 100;
    background: var(--bg-main);
    display: flex; flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  #chatScreen.active { transform: translateX(0); }

  /* Шапка чата */
  .chat-header {
    display: flex; align-items: center; gap: 12px;
    padding: calc(10px + var(--safe-t)) 12px 10px;
    background: var(--bg-header);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--stroke);
    z-index: 10;
  }
  .back-btn {
    background: none; border: none; font-size: 1.5em; color: var(--accent);
    cursor: pointer; padding: 0 8px; display: flex; align-items: center;
  }
  .chat-header-info { flex: 1; display: flex; flex-direction: column; }
  .chat-header-name { font-weight: 600; font-size: 1.05em; }
  .chat-header-status { font-size: 0.75em; color: var(--text-dim); }

  /* Область сообщений */
  .messages-area {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 16px 12px; display: flex; flex-direction: column; gap: 8px;
    /* Легкий паттерн на фоне */
    background-image: radial-gradient(var(--glass) 1px, transparent 1px);
    background-size: 20px 20px;
  }

  .msg-bubble {
    max-width: 85%; padding: 10px 14px; border-radius: 18px;
    font-size: 0.95em; line-height: 1.4; position: relative;
    word-wrap: break-word; overflow-wrap: anywhere;
    animation: popIn 0.2s ease;
  }
  @keyframes popIn { from { opacity: 0; transform: scale(0.9); } }

  .msg-bubble.in {
    align-self: flex-start; background: var(--bubble-in); color: var(--text);
    border-bottom-left-radius: 4px;
  }
  .msg-bubble.out {
    align-self: flex-end; background: var(--bubble-out); color: var(--bubble-text-out);
    border-bottom-right-radius: 4px;
  }
  .msg-time { font-size: 0.7em; opacity: 0.6; margin-top: 4px; text-align: right; float: right; margin-left: 8px;}

  /* Блок ввода (компактный, как в ТГ) */
  .composer-area {
    padding: 10px 12px calc(10px + var(--safe-b));
    background: var(--bg-header);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    border-top: 1px solid var(--stroke);
    display: flex; align-items: flex-end; gap: 8px;
  }
  
  .icon-btn {
    width: 44px; height: 44px; border-radius: 50%; border: none;
    background: var(--glass); color: var(--text-dim); font-size: 1.4em;
    display: grid; place-items: center; cursor: pointer; flex-shrink: 0;
    transition: .2s;
  }
  .icon-btn:active { background: var(--glass-hover); }

  .composer-input-wrap {
    flex: 1; background: var(--glass); border-radius: 22px;
    display: flex; align-items: center; padding: 0 16px;
    min-height: 44px;
  }
  .composer-input-wrap input {
    width: 100%; background: none; border: none; color: var(--text);
    font: inherit; font-size: 16px; outline: none; padding: 10px 0;
  }
  
  .send-btn {
    width: 44px; height: 44px; border-radius: 50%; border: none;
    background: var(--accent); color: white; font-size: 1.1em;
    display: grid; place-items: center; cursor: pointer; flex-shrink: 0;
    transition: .2s; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
  }
  .send-btn:active { transform: scale(0.9); }

  /* ================= НИЖНЯЯ НАВИГАЦИЯ ================= */
  .bottom-nav {
    display: flex; justify-content: space-around;
    padding: 6px 8px calc(6px + var(--safe-b));
    background: var(--bg-header);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    border-top: 1px solid var(--stroke);
    z-index: 10;
  }
  .nav-btn {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: none; border: none; color: var(--text-dim);
    font: inherit; cursor: pointer; padding: 8px 12px; border-radius: 16px;
    transition: .2s;
  }
  .nav-btn .nav-icon { font-size: 1.4em; line-height: 1; transition: transform .2s; }
  .nav-btn .nav-label { font-size: 0.7em; font-weight: 600; }
  .nav-btn.active { color: var(--accent); }
  .nav-btn.active .nav-icon { transform: scale(1.1) translateY(-2px); }
  .nav-btn:active { background: var(--glass); }

  /* ================= НАСТРОЙКИ ================= */
  .settings-scroll { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
  .group { background: var(--bubble-in); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 16px; border: 1px solid var(--stroke); }
  .group-title { font-size: 0.8em; text-transform: uppercase; color: var(--text-dim); font-weight: 600; letter-spacing: 0.5px; }
  .row { display: flex; align-items: center; justify-content: space-between; }
  .row-text { font-weight: 500; font-size: 0.95em; }
  
  .segmented { display: flex; gap: 4px; padding: 4px; background: var(--bg-main); border-radius: 12px; }
  .segmented button { flex: 1; border: none; background: none; color: var(--text-dim); padding: 8px; border-radius: 8px; font-size: 0.85em; font-weight: 600; cursor: pointer; transition: .2s; }
  .segmented button.active { background: var(--glass-hover); color: var(--text); }

  .swatches { display: flex; gap: 10px; }
  .swatches button { width: 32px; height: 32px; border-radius: 50%; border: 2px solid transparent; background: var(--c); cursor: pointer; }
  .swatches button.active { border-color: var(--text); transform: scale(1.1); }

  .switch { position: relative; width: 50px; height: 30px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: var(--glass); border-radius: 30px; cursor: pointer; transition: .3s; border: 1px solid var(--stroke); }
  .slider::before { content: ""; position: absolute; height: 24px; width: 24px; left: 3px; bottom: 2px; background: var(--text-dim); border-radius: 50%; transition: .3s; }
  .switch input:checked + .slider { background: var(--accent); border-color: var(--accent); }
  .switch input:checked + .slider::before { transform: translateX(20px); background: #fff; }

  .logout-btn { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); padding: 16px; border-radius: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; }
  
</style>
</head>
<body>

<!-- ============ ЭКРАН АВТОРИЗАЦИИ ============ -->
<div class="screen active" id="authScreen">
  <div class="auth-card">
    <div class="brand">
      <div class="logo">◈</div>
      <div>
        <h1>Glass Messenger</h1>
        <p>Стильный мессенджер</p>
      </div>
    </div>

    <div class="tabs">
      <button class="active" data-tab="login" type="button">Вход</button>
      <button data-tab="register" type="button">Регистрация</button>
    </div>

    <form id="authForm" style="display:flex;flex-direction:column;gap:16px">
      <div class="field">
        <input id="nick" type="text" placeholder="Никнейм" autocomplete="username" required>
      </div>
      <div class="field">
        <input id="pass" type="password" placeholder="Пароль" autocomplete="current-password" required>
        <button type="button" class="pwd-toggle" id="togglePass">👁️</button>
      </div>
      <div class="field" id="pass2Wrap" style="display:none">
        <input id="pass2" type="password" placeholder="Повторите пароль">
      </div>
      <button class="btn primary" id="authSubmit" type="submit" style="margin-top:8px">Войти</button>
    </form>

    <p class="msg" id="authMsg"></p>
  </div>
</div>

<!-- ============ ПРИЛОЖЕНИЕ ============ -->
<div class="screen" id="appScreen">

  <!-- ГЛАВНЫЙ ЭКРАН (С вкладками) -->
  <div class="main-content">
    
    <!-- Вкладка: Чаты -->
    <div class="tab-view active" id="tab-chats">
      <div class="main-header">
        <h2>Чаты</h2>
      </div>
      <div class="list-scroll" id="chatList">
        <!-- Список генерируется JS -->
      </div>
    </div>

    <!-- Вкладка: Избранное -->
    <div class="tab-view" id="tab-favorites">
      <div class="main-header">
        <h2>Избранное</h2>
      </div>
      <div class="list-scroll">
        <div class="chat-item" onclick="openChat('favorites')">
          <div class="avatar gray">⭐</div>
          <div class="chat-info">
            <div class="chat-top"><span class="chat-name">Избранное</span></div>
            <div class="chat-bottom"><span class="chat-last">Сохраненные сообщения и файлы</span></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Вкладка: ИИ -->
    <div class="tab-view" id="tab-ai">
      <div class="main-header">
        <h2>ИИ Ассистент</h2>
      </div>
      <div class="list-scroll">
        <div class="chat-item" onclick="openChat('ai')">
          <div class="avatar green">🤖</div>
          <div class="chat-info">
            <div class="chat-top"><span class="chat-name">Glass AI</span><span class="chat-time">Онлайн</span></div>
            <div class="chat-bottom"><span class="chat-last">Привет! Чем я могу помочь?</span></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Вкладка: Настройки -->
    <div class="tab-view" id="tab-settings">
      <div class="main-header">
        <h2>Настройки</h2>
      </div>
      <div class="settings-scroll">
        <div class="group">
          <div class="group-title">Оформление</div>
          <div class="row" style="flex-direction: column; align-items: flex-start; gap: 10px;">
            <span class="row-text">Тема</span>
            <div class="segmented" id="themeSeg" style="width: 100%;">
              <button type="button" data-value="dark">Тёмная</button>
              <button type="button" data-value="light">Светлая</button>
            </div>
          </div>
          <div class="row" style="flex-direction: column; align-items: flex-start; gap: 10px;">
            <span class="row-text">Акцент</span>
            <div class="swatches" id="accentSwatches" style="width: 100%; justify-content: space-between;">
              <button type="button" data-color="#6366f1" style="--c:#6366f1"></button>
              <button type="button" data-color="#06b6d4" style="--c:#06b6d4"></button>
              <button type="button" data-color="#22c55e" style="--c:#22c55e"></button>
              <button type="button" data-color="#f59e0b" style="--c:#f59e0b"></button>
              <button type="button" data-color="#ec4899" style="--c:#ec4899"></button>
            </div>
          </div>
        </div>
        <button class="logout-btn" id="logout" type="button">Выйти из аккаунта</button>
      </div>
    </div>

  </div>

  <!-- НИЖНЯЯ НАВИГАЦИЯ -->
  <nav class="bottom-nav">
    <button class="nav-btn active" data-tab="chats">
      <span class="nav-icon">💬</span><span class="nav-label">Чаты</span>
    </button>
    <button class="nav-btn" data-tab="favorites">
      <span class="nav-icon">⭐</span><span class="nav-label">Избранное</span>
    </button>
    <button class="nav-btn" data-tab="ai">
      <span class="nav-icon">🤖</span><span class="nav-label">ИИ</span>
    </button>
    <button class="nav-btn" data-tab="settings">
      <span class="nav-icon">⚙️</span><span class="nav-label">Настройки</span>
    </button>
  </nav>

</div>

<!-- ============ ЭКРАН ЧАТА ============ -->
<div id="chatScreen">
  <header class="chat-header">
    <button class="back-btn" onclick="closeChat()">‹</button>
    <div class="avatar" id="chatAvatar" style="width: 40px; height: 40px; font-size: 1em;">?</div>
    <div class="chat-header-info">
      <span class="chat-header-name" id="chatName">Имя</span>
      <span class="chat-header-status" id="chatStatus">в сети</span>
    </div>
  </header>

  <div class="messages-area" id="messagesArea"></div>

  <div class="composer-area">
    <button class="icon-btn">📎</button>
    <div class="composer-input-wrap">
      <input id="msgInput" type="text" placeholder="Сообщение" autocomplete="off">
    </div>
    <button class="send-btn" id="sendBtn">➤</button>
  </div>
</div>

<script>
/* ==================== ХРАНИЛИЩЕ ==================== */
const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));

const K = { session: 'gm_session', settings: 'gm_settings' };
const readJSON = (k, def) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? def; } catch { return def; } };
const writeJSON = (k, v) => localStorage.setItem(k, JSON.stringify(v));

/* ==================== НАСТРОЙКИ ==================== */
let settings = Object.assign({ theme: 'dark', accent: '#6366f1' }, readJSON(K.settings, {}));

function applySettings() {
  document.documentElement.dataset.theme = settings.theme;
  document.documentElement.style.setProperty('--accent', settings.accent);
  
  // Обновляем статус-бар
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = settings.theme === 'light' ? '#f2f4f8' : '#0f1015';
  
  // Обновляем UI настроек
  $$('#themeSeg button').forEach(b => b.classList.toggle('active', b.dataset.value === settings.theme));
  $$('#accentSwatches button').forEach(b => b.classList.toggle('active', b.dataset.color.toLowerCase() === settings.accent.toLowerCase()));
}

/* ==================== АВТОРИЗАЦИЯ ==================== */
let authMode = 'login';

$$('.tabs button').forEach(btn => btn.addEventListener('click', () => {
  authMode = btn.dataset.tab;
  $$('.tabs button').forEach(b => b.classList.toggle('active', b === btn));
  $('#pass2Wrap').style.display = authMode === 'register' ? 'block' : 'none';
  $('#authSubmit').textContent = authMode === 'register' ? 'Создать аккаунт' : 'Войти';
  showMsg('');
}));

$('#togglePass').addEventListener('click', () => {
  const pwd = $('#pass');
  pwd.type = pwd.type === 'password' ? 'text' : 'password';
  $('#togglePass').textContent = pwd.type === 'password' ? '👁️' : '🙈';
});

function showMsg(text, isOk = false) {
  const el = $('#authMsg');
  el.textContent = text;
  el.className = 'msg ' + (isOk ? 'ok' : '');
}

$('#authForm').addEventListener('submit', e => {
  e.preventDefault();
  const nick = $('#nick').value.trim();
  const pass = $('#pass').value;
  const pass2 = $('#pass2').value;

  if (nick.length < 3) return showMsg('Никнейм от 3 символов');
  if (pass.length < 4) return showMsg('Пароль от 4 символов');
  if (authMode === 'register' && pass !== pass2) return showMsg('Пароли не совпадают');

  // Демо-вход без сложной БД
  showMsg('Успешно!', true);
  setTimeout(() => {
    writeJSON(K.session, { nick });
    startApp(nick);
  }, 500);
});

function startApp(nick) {
  $('#authScreen').classList.remove('active');
  $('#appScreen').classList.add('active');
}

$('#logout').addEventListener('click', () => {
  localStorage.removeItem(K.session);
  $('#appScreen').classList.remove('active');
  $('#authScreen').classList.add('active');
  $('#authForm').reset();
  showMsg('');
});

/* ==================== НАВИГАЦИЯ (ВКЛАДКИ) ==================== */
$$('.nav-btn').forEach(btn => btn.addEventListener('click', () => {
  $$('.nav-btn').forEach(b => b.classList.toggle('active', b === btn));
  $$('.tab-view').forEach(v => v.classList.toggle('active', v.id === 'tab-' + btn.dataset.tab));
}));

/* ==================== СПИСОК ЧАТОВ ==================== */
const mockChats = [
  { id: '1', name: 'Сергей', last: 'Привет! Как дела?', time: '12:30', unread: 2, color: 'linear-gradient(135deg, #3b82f6, #2dd4bf)' },
  { id: '2', name: 'Дизайн-группа', last: 'Макет готов к проверке', time: '11:05', unread: 0, color: 'linear-gradient(135deg, #f59e0b, #ef4444)' },
  { id: '3', name: 'Анна', last: 'Спасибо за помощь 🙏', time: 'Вчера', unread: 0, color: 'linear-gradient(135deg, #ec4899, #8b5cf6)' }
];

function renderChatList() {
  $('#chatList').innerHTML = mockChats.map(c => `
    <div class="chat-item" onclick="openChat('${c.id}', '${c.name}', '${c.color}')">
      <div class="avatar" style="background: ${c.color}">${c.name[0]}</div>
      <div class="chat-info">
        <div class="chat-top">
          <span class="chat-name">${c.name}</span>
          <span class="chat-time">${c.time}</span>
        </div>
        <div class="chat-bottom">
          <span class="chat-last">${c.last}</span>
          ${c.unread ? `<span class="chat-badge">${c.unread}</span>` : ''}
        </div>
      </div>
    </div>
  `).join('');
}

/* ==================== ЭКРАН ЧАТА ==================== */
let currentChatId = null;

// База сообщений в оперативной памяти (для демо)
const messagesDB = {
  '1': [
    { text: 'Привет! Это обновленный интерфейс.', out: false, time: '12:00' },
    { text: 'Теперь ввод сообщений работает корректно, а кнопки не перекрывают экран.', out: false, time: '12:01' },
    { text: 'Круто! А стиль как в телеге?', out: true, time: '12:05' },
    { text: 'Да, старался сделать похоже 😎', out: false, time: '12:30' }
  ],
  '2': [
    { text: 'Скинь макет', out: true, time: '10:00' },
    { text: 'Макет готов к проверке', out: false, time: '11:05' }
  ],
  '3': [
    { text: 'Спасибо за помощь 🙏', out: false, time: 'Вчера' }
  ],
  'favorites': [
    { text: 'Сюда можно сохранять важные ссылки и заметки.', out: true, time: '10:00' }
  ],
  'ai': [
    { text: 'Привет! Я Glass AI. Пока я работаю в демо-режиме и просто повторяю за тобой 😊', out: false, time: 'Сейчас' }
  ]
};

function openChat(id, name, color) {
  currentChatId = id;
  
  // Настройка шапки
  if (id === 'favorites') {
    $('#chatName').textContent = 'Избранное';
    $('#chatAvatar').textContent = '⭐';
    $('#chatAvatar').style.background = '#333';
    $('#chatStatus').textContent = 'ваши заметки';
  } else if (id === 'ai') {
    $('#chatName').textContent = 'Glass AI';
    $('#chatAvatar').textContent = '🤖';
    $('#chatAvatar').style.background = '#22c55e';
    $('#chatStatus').textContent = 'онлайн';
  } else {
    $('#chatName').textContent = name;
    $('#chatAvatar').textContent = name[0];
    $('#chatAvatar').style.background = color;
    $('#chatStatus').textContent = 'в сети';
  }

  renderMessages(id);
  
  // Анимация выезда
  $('#chatScreen').classList.add('active');
}

function closeChat() {
  $('#chatScreen').classList.remove('active');
  setTimeout(() => { currentChatId = null; }, 300);
}

function renderMessages(id) {
  const area = $('#messagesArea');
  const msgs = messagesDB[id] || [];
  
  area.innerHTML = msgs.map(m => `
    <div class="msg-bubble ${m.out ? 'out' : 'in'}">
      ${escapeHtml(m.text)}
      <span class="msg-time">${m.time}</span>
    </div>
  `).join('');
  
  // Прокрутка вниз
  setTimeout(() => { area.scrollTop = area.scrollHeight; }, 10);
}

function escapeHtml(str) {
  return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// Отправка сообщения
function sendMessage() {
  const input = $('#msgInput');
  const text = input.value.trim();
  if (!text || !currentChatId) return;

  // Добавляем сообщение пользователя
  messagesDB[currentChatId].push({
    text: text,
    out: true,
    time: new Date().toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'})
  });
  input.value = '';
  renderMessages(currentChatId);

  // Имитация ответа для ИИ
  if (currentChatId === 'ai') {
    setTimeout(() => {
      messagesDB['ai'].push({
        text: 'Вы сказали: "' + text + '". Я пока учусь, но скоро стану умнее!',
        out: false,
        time: new Date().toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'})
      });
      if (currentChatId === 'ai') renderMessages('ai');
    }, 1000);
  }
}

$('#sendBtn').addEventListener('click', sendMessage);
$('#msgInput').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') sendMessage();
});

/* ==================== НАСТРОЙКИ UI ==================== */
$$('#themeSeg button').forEach(b => b.addEventListener('click', () => {
  settings.theme = b.dataset.value;
  writeJSON(K.settings, settings);
  applySettings();
}));

$$('#accentSwatches button').forEach(b => b.addEventListener('click', () => {
  settings.accent = b.dataset.color;
  writeJSON(K.settings, settings);
  applySettings();
}));

/* ==================== СТАРТ ==================== */
applySettings();
renderChatList();

const session = readJSON(K.session, null);
if (session && session.nick) {
  startApp(session.nick);
}
</script>
