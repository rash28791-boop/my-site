<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Biboz</title>
<style>
*{ margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif }
:root{--bg:#1a1a2e;--surface:#16213e;--card:#0f3460;--accent:#e94560;--text:#eee;--text2:#aaa;--border:#2a2a4a}
body{background:var(--bg);color:var(--text);height:100vh;display:flex;justify-content:center;align-items:center}
.app{width:100%;max-width:420px;height:100vh;max-height:780px;background:var(--surface);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 0 40px rgba(0,0,0,.5)}
/* Auth */
.auth-page{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:32px;gap:16px}
.auth-page h1{font-size:32px;color:var(--accent);margin-bottom:8px}
.auth-page p{color:var(--text2);margin-bottom:16px}
.auth-page input{width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:15px;outline:none;transition:.2s}
.auth-page input:focus{border-color:var(--accent)}
.auth-page .captcha{display:flex;gap:8px;width:100%;align-items:center}
.auth-page .captcha input{flex:1}
.auth-page .captcha-box{background:var(--card);padding:10px 16px;border-radius:12px;font-size:18px;font-weight:bold;letter-spacing:3px;color:var(--accent);user-select:none;white-space:nowrap}
.auth-page .btn{width:100%;padding:14px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:.2s}
.auth-page .btn:hover{opacity:.85}
.auth-page .switch{color:var(--text2);font-size:13px;cursor:pointer}
.auth-page .switch span{color:var(--accent)}
/* Main layout */
.main-page{display:none;flex-direction:column;height:100%}
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border)}
.header h2{font-size:18px}
.header .icons{display:flex;gap:12px}
.header .icons span{cursor:pointer;font-size:20px}
/* Chat list */
.chat-list{flex:1;overflow-y:auto;padding:8px}
.chat-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;cursor:pointer;transition:.15s}
.chat-item:hover{background:var(--card)}
.chat-item .avatar{width:48px;height:48px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:bold;flex-shrink:0}
.chat-item .info{flex:1;min-width:0}
.chat-item .info .name{font-size:15px;font-weight:500}
.chat-item .info .last{font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-item .time{font-size:11px;color:var(--text2)}
/* Chat view */
.chat-view{display:none;flex-direction:column;height:100%}
.chat-view .chat-header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border)}
.chat-view .chat-header .back{font-size:22px;cursor:pointer}
.chat-view .chat-header .name{font-size:16px;font-weight:500}
.messages{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:6px}
.msg{max-width:80%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.4;word-wrap:break-word}
.msg.out{background:var(--accent);align-self:flex-end;border-bottom-right-radius:4px}
.msg.in{background:var(--card);align-self:flex-start;border-bottom-left-radius:4px}
.msg .time{font-size:10px;color:var(--text2);margin-top:4px;text-align:right}
.msg .sticker{font-size:48px;display:block;text-align:center;padding:4px}
.input-area{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--border)}
.input-area input{flex:1;padding:10px 14px;border-radius:20px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;outline:none}
.input-area input:focus{border-color:var(--accent)}
.input-area .send-btn{width:40px;height:40px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.input-area .sticker-btn{font-size:22px;cursor:pointer;padding:4px}
/* Sticker picker */
.sticker-picker{display:none;padding:12px;border-top:1px solid var(--border);background:var(--bg)}
.sticker-picker .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sticker-picker .grid span{font-size:36px;text-align:center;cursor:pointer;padding:6px;border-radius:8px;transition:.15s}
.sticker-picker .grid span:hover{background:var(--card)}
/* Profile */
.profile-page{display:none;flex-direction:column;height:100%;padding:24px;align-items:center;gap:16px}
.profile-page .avatar{width:80px;height:80px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:bold}
.profile-page .name{font-size:20px;font-weight:600}
.profile-page .status{color:var(--text2);font-size:14px}
.profile-page .btn-out{width:100%;padding:12px;border-radius:12px;border:1px solid var(--accent);background:transparent;color:var(--accent);font-size:15px;cursor:pointer;margin-top:auto}
/* Settings */
.settings-page{display:none;flex-direction:column;height:100%;padding:16px;gap:12px}
.settings-page .back{font-size:22px;cursor:pointer;margin-bottom:8px}
.settings-page .row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}
.settings-page .row label{font-size:14px}
.settings-page .row input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
/* Scrollbar */
:-webkit-scrollbar{width:4px}
:-webkit-scrollbar-thumb{background:var(--card);border-radius:4px}
/* Animations */
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.msg{animation:fadeIn .2s ease}
</style>
</head>
<body>
<div class="app" id="app">
  <!-- Auth -->
  <div class="auth-page" id="authPage">
    <h1>Biboz</h1>
    <p>Мессенджер нового поколения</p>
    <input type="text" id="authName" placeholder="Имя пользователя" maxlength="20">
    <input type="password" id="authPass" placeholder="Пароль" style="display:none">
    <div class="captcha">
      <input type="text" id="authCaptcha" placeholder="Капча">
      <div class="captcha-box" id="captchaBox">AB12</div>
    </div>
    <button class="btn" id="authBtn">Войти</button>
    <div class="switch" id="authSwitch">Нет аккаунта? <span>Зарегистрироваться</span></div>
  </div>

  <!-- Main -->
  <div class="main-page" id="mainPage">
    <div class="header">
      <h2>Biboz</h2>
      <div class="icons">
        <span id="profileBtn">📤</span>
        <span id="settingsBtn">⚅️</span>
      </div>
    </div>
    <div class="chat-list" id="chatList"></div>
  </div>

  <!-- Chat View -->
  <div class="chat-view" id="chatView">
    <div class="chat-header">
      <span class="back" id="chatBack">←</span>
      <div class="avatar" id="chatAvatar" style="width:36px;height:36px;font-size:16px">👤</div>
      <span class="name" id="chatName"">Чат</span>
    </div>
    <div class="messages" id="messages"></div>
    <div class="sticker-picker" id="stickerPicker">
      <div class="grid" id="stickerGrid"></div>
    </div>
    <div class="input-area">
      <span class="sticker-btn" id="stickerBtn">😈</span>
      <input type="text" id="msgInput" placeholder="Сообщение..." maxlength="500">
      <button class="send-btn" id="sendBtn">➨</button>
    </div>
  </div>

  <!-- Profile -->
  <div class="profile-page" id="profilePage">
    <div class="avatar" id="profAvatar">👤</div>
    <div class="name" id="profName">Пользователь</div>
    <div class="status">Онлайн</div>
    <button class="btn-out" id="logoutBtn">Выйти</button>
  </div>

  <!-- Settings -->
  <div class="settings-page" id="settingsPage">
    <span class="back" id="settingsBack">← Настройки</span>
    <div class="row"><label>Тёмная тема</label><input type="checkbox" checked id="themeToggle"></div>
    <div class="row"><label>Уведомления</label><input type="checkbox" checked id="notifToggle"></div>
    <div class="row"><label>Звук сообщений</label><input type="checkbox" checked id="soundToggle"></div>
  </div>
</div>

<script>
// State
let users = JSON.parse(localStorage.getItem('biboz_users') || '{}')
let chats = JSON.parse(localStorage.getItem('biboz_chats') || '{}')
let currentUser = localStorage.getItem('biboz_user') || ''
